plugins { id 'com.android.application' }
android {
    namespace 'ar.com.artiko.envio1702'
    compileSdk 34
    defaultConfig {
        applicationId 'ar.com.artiko.envio1702'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    // Firma fija: el archivo firma.jks lo crea GitHub a partir del secreto KEYSTORE_B64.
    // Con la misma firma, cada versión nueva se instala encima de la anterior sin desinstalar.
    signingConfigs {
        propia {
            storeFile file('firma.jks')
            storePassword 'logistica1702'
            keyAlias 'app1702'
            keyPassword 'logistica1702'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig file('firma.jks').exists() ? signingConfigs.propia : signingConfigs.debug }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // Lector de QR de Google: no pide permiso de cámara y funciona en casi todos los Android.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // Ubicación en segundo plano durante la ruta
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.core:core:1.13.1'
    // Alinea las versiones de Kotlin que traen las librerías (evita clases duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
